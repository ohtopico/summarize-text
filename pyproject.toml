[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sumarizador"
version = "0.1.0"
description = "Sumarizador extrativo de textos em português (e inglês), sem dependências."
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
sumarizar = "sumarizador.cli:main"

[tool.setuptools]
packages = ["sumarizador"]
